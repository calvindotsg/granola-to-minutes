version: 2

# Every `uses:` in .github/workflows/ is pinned to a 40-character commit SHA, which is what makes
# an upstream tag move (the tj-actions/changed-files scenario, CVE-2025-30066) a non-event here.
# The cost of that is pins going stale silently, so Dependabot exists to bump them on a reviewed
# PR — it rewrites both the SHA and the trailing `# vN` comment. Without this, pinning trades a
# supply-chain risk for an unpatched-dependency one.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for the dev toolchain rather than eight. Runtime deps (commander, gray-matter)
      # stay ungrouped so they get individual review.
      dev-dependencies:
        dependency-type: development
    ignore:
      # gray-matter 4.x pins js-yaml ^3.13.1 and calls safeDump, which js-yaml 4 removed. Forcing
      # the transitive bump breaks the writer outright -- CI catches it, but the PR reopens every
      # week (see #40, which failed all three Node legs on a lockfile-only change).
      #
      # Staying on 3.x is no longer a security cost. Upstream backported the merge-key and !!omap
      # fixes to 3.15.0/3.15.1, and `^3.13.1` accepts them, so all three advisories cleared on a
      # plain `pnpm update` -- a *minor* bump this rule does not block. Replacing gray-matter is
      # now a maintenance question (it last shipped in 2019), not a security one.
      #
      # Do not expect Dependabot to do that bump for you. `js-yaml` is two different things in
      # this tree: a direct devDependency at ^5.3.0 (contract suite) and gray-matter's nested 3.x.
      # One manifest entry cannot express both, and the nested copy has no manifest entry at all,
      # so a version update sees only the shared name and proposes the latest -- which is what #40
      # did. Security updates are enabled and unpaused, and still never proposed 3.15.1: the
      # patched releases sat unadopted for seven weeks. Re-run `pnpm update` by hand when a
      # js-yaml advisory appears and confirm with `pnpm why js-yaml` that the *nested* copy moved.
      #
      # This also freezes major bumps of the direct js-yaml devDependency used by the contract
      # suite. That is an accepted cost: it is already on the current major, and one dependency
      # name cannot be split across the two roles here.
      - dependency-name: js-yaml
        update-types: ["version-update:semver-major"]
