name: Release

# Two independent triggers, deliberately decoupled:
#
#   push to main      -> release-please opens/updates the release PR, and on merge tags the
#                        release and publishes a GitHub Release.
#   release published -> npm-publish builds and publishes that exact tag to npm.
#
# npm-publish used to be gated on `needs.release-please.outputs.release_created`. That output
# name is mode-dependent — non-manifest mode emits `release_created`, manifest mode emits
# `releases_created` — and reading the wrong one yields an empty string, which SKIPS the job
# without failing the run. A skipped job renders as a green tick, so the break is invisible.
# Keying off the GitHub Release itself removes that entire class of failure: if a release exists,
# it gets published, no matter how it was created.

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      # Do NOT pass `release-type` here. Supplying it runs the action in non-manifest mode, which
      # ignores release-please-config.json entirely — the release type is declared in that file.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm-publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; there is no NPM_TOKEN secret
    steps:
      # Checks out the release tag, not main — publish exactly what was released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public
