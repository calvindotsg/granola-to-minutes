name: Contract drift

# Watches the Minutes frontmatter contract for upstream movement.
#
# `push` is not redundant with `schedule`. GitHub disables scheduled workflows on public repos
# after 60 days without repository activity, and this repo has already gone ~120 days quiet once
# (2026-04-10 → 2026-08-08) — the cron would die exactly when it was most needed. Every merge to
# main re-arms that clock, and gives a drift check on the repo's real cadence for free.
#
# If the repo does go quiet past 60 days, GitHub disables the cron and shows a banner on the
# Actions tab; re-enable it from there.
#
# Deliberately NOT part of the required `test` check: a PR must never fail because of a network
# blip or an upstream change unrelated to that PR.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: contract-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Compare pinned upstream artifacts
        id: drift
        run: |
          set +e
          node scripts/check-contract-drift.mjs > report.md 2> fetch-errors.log
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat fetch-errors.log

      # Exit 2 means we could not reach upstream. That is not drift and must not open an issue.
      - name: Note unreachable upstream
        if: steps.drift.outputs.status == '2'
        run: |
          echo "::warning::Could not reach upstream to check contract drift; skipping."
          cat fetch-errors.log >> "$GITHUB_STEP_SUMMARY"

      # Selecting the issue by TITLE alone made this channel capturable: a title is not a namespace,
      # and any GitHub user could pre-create one with that exact string and receive every future
      # drift report in a thread they control.
      #
      # The label is the fix, and on its own. Applying a label needs triage permission, so an
      # outside user cannot attach `contract-drift` to an issue they open -- which is exactly the
      # property the title lacked. Deliberately NOT also filtering on --author: `app/github-actions`
      # is GitHub *search* syntax and returns nothing through `gh issue list --author`, which would
      # silently leave `existing` empty and open a duplicate issue on every drift run.
      #
      # The `contract-drift` label must exist -- `gh issue create --label` errors on a missing one.
      - name: Open or update the drift issue
        if: steps.drift.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Minutes frontmatter contract has drifted upstream"
          LABEL: contract-drift
        run: |
          existing=$(gh issue list --state open --label "$LABEL" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file report.md
          fi
