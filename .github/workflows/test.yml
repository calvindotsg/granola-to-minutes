name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every build step runs third-party dev-dependency code, and the repository default for
# GITHUB_TOKEN is `write`. Nothing in this workflow writes to the repo, so nothing here needs a
# token that could.
permissions:
  contents: read

jobs:
  # The `main-protection` ruleset requires a status check whose context is exactly
  # `test`, with no bypass actors. A matrix job publishes one check run per leg
  # (`test (22)`, `test (24)`, ...), so nothing would ever report the bare `test`
  # context and every PR would hang on "Expected — waiting for status".
  # The matrix therefore runs under a different name, and the `test` job below
  # fans it in. Do not give this job a static `name: test` instead: three check
  # runs sharing one context resolve to the most recent report, so a failing leg
  # can be masked by a later-finishing passing one.
  test-matrix:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

      - run: pnpm test:cov

  # `npm pack` runs for real only at release time, in release.yml's `build` job, and a release is
  # a bad place to discover it does not work: it is npm's packer reading a pnpm-installed tree,
  # and a change to `files`, to tsconfig's outDir, or to the build itself can quietly empty the
  # tarball without failing anything else. Publishing a pre-packed tarball also means npm skips
  # `prepublishOnly`, so nothing downstream of pack would notice. This job runs the same command
  # on every PR and asserts the tarball actually contains the shipped entry point.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack and inspect the tarball a release would publish
        run: |
          mkdir -p "${RUNNER_TEMP}/pack"
          npm pack --silent --pack-destination "${RUNNER_TEMP}/pack"
          mv "${RUNNER_TEMP}"/pack/*.tgz package.tgz
          tar tzf package.tgz > "${RUNNER_TEMP}/contents.txt"
          cat "${RUNNER_TEMP}/contents.txt"
          grep -qx 'package/package.json' "${RUNNER_TEMP}/contents.txt"
          grep -qx 'package/dist/cli.js' "${RUNNER_TEMP}/contents.txt"

  # Required status check for `main`. Keep this job id exactly `test`.
  test:
    needs: [test-matrix, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job passed
        run: |
          echo "test-matrix result: ${{ needs.test-matrix.result }}"
          echo "package result: ${{ needs.package.result }}"
          [ "${{ needs.test-matrix.result }}" = "success" ]
          [ "${{ needs.package.result }}" = "success" ]

  # Reports, never gates. Deliberately NOT a dependency of `test`, and deliberately always exit 0.
  #
  # `pnpm audit` is clean as of 2026-08-20 -- both `--prod` and the full tree report zero. It was
  # red on gray-matter's pinned js-yaml 3.x; upstream backported the merge-key and !!omap fixes to
  # 3.15.0/3.15.1, which satisfy gray-matter's `^3.13.1`, so the whole set cleared on a lockfile
  # bump. See .github/dependabot.yml for why the 3.x pin stays.
  #
  # Read the timeline before concluding a gate would have helped. Upstream was fast: 3.15.0 landed
  # 11 days after the first advisory and 3.15.1 five days *before* the third was even published.
  # The patched versions then sat unadopted here for seven weeks, and no Dependabot PR ever
  # proposed them -- the one PR it did raise, #40, jumped the shared name to 5.3.0 and failed CI.
  # Adoption took a human running `pnpm update`. A gate would have frozen `main` for those seven
  # weeks over a fix that was one command away: it blocks the unrelated PRs, not the neglect.
  #
  # The actual alerting mechanism is Dependabot security alerts, which dedupe and track state.
  # This job puts the current count in front of a reviewer on every PR. With the baseline at
  # zero, any output at all in the block below is a regression worth reading.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Report advisories
        run: |
          {
            echo "## Runtime dependencies (\`--prod\`)"
            echo '```'
            pnpm audit --prod 2>&1 || true
            echo '```'
            echo "## All dependencies"
            echo '```'
            pnpm audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
